name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name PixivWallpaper --collect-all pystray --icon=assets/app-icon.ico --add-data "assets/app-icon.png;assets" app.py
      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/PixivWallpaper -DestinationPath dist/PixivWallpaper-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PixivWallpaper-Windows
          path: dist/PixivWallpaper-Windows.zip
