worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    log_format timing '$remote_addr "$request" status=$status bytes=$body_bytes_sent '
                      'total=$request_time upstream=$upstream_response_time';
    access_log /dev/stdout timing;
    server_tokens off;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
    server {
        listen 8080;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /health { access_log off; return 200 "ok\n"; }
        location ~ ^/images(/(?:img-original|img-master)/[A-Za-z0-9_./-]+\.(?:jpg|jpeg|png|webp))$ {
            return 302 https://i.pixiv.re$1;
        }
        location ~ ^/(?:ranking\.php|ajax/illust/[0-9]+(?:/pages)?)$ {
            limit_req zone=api burst=10 nodelay;
            set $upstream www.pixiv.net;
            proxy_pass https://$upstream$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name www.pixiv.net;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host www.pixiv.net;
            proxy_set_header Referer https://www.pixiv.net/;
            proxy_set_header User-Agent Mozilla/5.0;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_redirect off;
        }
        location / { return 404; }
    }
}
